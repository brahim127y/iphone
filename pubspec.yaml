name: boutique_app
description: Application de gestion de boutique — catégories, produits, ventes, clients, export PDF.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  pin_code_fields: ^8.0.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
