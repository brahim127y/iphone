publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  intl: ^0.19.0
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
