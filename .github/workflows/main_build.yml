name: Build Tembs Applications

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Compile Windows Setup Installer (.exe)
        run: |
          iscc installer.iss

      - name: Upload Windows Installer (Setup_Tembs_Boutique.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Setup_Tembs_Boutique_Windows
          path: build/windows/installer/Setup_Tembs_Boutique.exe



  build-ios:
    name: Build iOS App (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Zip iOS Build Artifact
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-runner
          path: build/ios/iphoneos/Runner.app.zip
